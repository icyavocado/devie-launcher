name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship the Android SDK (ANDROID_HOME/PATH preset);
      # android-actions/setup-android broke on the retired 'tools' package.
      # AGP auto-provisions missing platforms/build-tools; licenses first.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing material
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE }}
          PROPS: ${{ secrets.RELEASE_PROPERTIES }}
        run: |
          mkdir -p keystore
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > keystore/evie-release.jks
          fi
          if [ -n "$PROPS" ]; then
            printf '%s' "$PROPS" > keystore/evie-release.properties
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "devie-launcher-${{ github.ref_name }}.apk"
          echo "APK=devie-launcher-${{ github.ref_name }}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # every release is tagged with the app version (e.g. v2.14.8-rw1)
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ env.APK }}
          generate_release_notes: true