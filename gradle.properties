# JVM args: launcher codebase is large; give the daemon room.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (required by AGP 9)
android.useAndroidX=true

# Decompiled Evie code predates these modern defaults; keep legacy R semantics
# (final constants for `switch(view.getId())`, transitive R across vendored pkgs).
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# No legacy support-library deps are being carried over.
android.enableJetifier=true
android.r8.optimizedResourceShrinking=false
